<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEM | Instrumentos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/asistencias.css">
</head>
<body>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Abrir menú"
    aria-expanded="false"
>
    ☰
</button>

  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="content">
      <header class="page-header">
        <div>
          <span class="eyebrow">Instrumentos</span>
          <h1>Gestión de instrumentos</h1>
        </div>
        
      </header>

      <!-- ==========================
           VISTA PRINCIPAL - TARJETAS
      =========================== -->

      <section id="vistaInstrumentos">

        <div class="cards-asistencias" id="tarjetasInstrumentos">
        </div>

      </section>


      <!-- ==========================
           VISTA ALUMNOS DEL INSTRUMENTO
      =========================== -->

      <section id="vistaAlumnos" class="hidden">

        <div class="page-header">

          <div>
            <span class="eyebrow">Instrumentos</span>
            <h2 id="tituloInstrumento">Instrumento</h2>
          </div>

          <button
            id="volverInstrumentos"
            class="button secondary">
            Volver
          </button>

        </div>


        <section class="card filtros">

          <div class="form-grid">

            <label class="field">

              <span>
                Buscar alumno
              </span>

              <input
                id="buscarAlumno"
                placeholder="Nombre o apellido">

            </label>


            <label class="field">

              <span>
                Nivel
              </span>

              <select id="filtroNivel">
                <option value="">
                  Todos
                </option>
              </select>

            </label>


            <label class="field">

              <span>
                Instructor
              </span>

              <select id="filtroInstructor">
                <option value="">
                  Todos
                </option>
              </select>

            </label>


            <label class="field">

              <span>
                Estado
              </span>

              <select id="filtroEstado">

                <option value="">
                  Todos
                </option>

                <option value="Activo">
                  Activo
                </option>

                <option value="Finalizado">
                  Finalizado
                </option>

              </select>

            </label>


            <button
              id="btnLimpiarFiltros"
              class="button secondary"
              type="button">
              Limpiar filtros
            </button>

          </div>

        </section>


        <div id="gruposNiveles">
        </div>

      </section>

    </main>
  </div>
<script src="js/api.js"></script>
<script src="js/notificaciones.js"></script>
<script src="js/acciones.js"></script>
<script src="js/instrumentos.js"></script>
<script src="js/menu.js"></script>
<script src="js/auth.js"></script>

<script>
    verificarSesion();
</script>
</body>
</html>
