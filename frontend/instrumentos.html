<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEM | Instrumentos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Abrir menú"
    aria-expanded="false"
>
    ☰
</button>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">SIGEM</div>
        <p>Enseñanza de música</p>
      </div>

      <nav class="main-nav" aria-label="Menu principal">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="alumnos.html">Alumnos</a>
        <a class="nav-link active" href="instrumentos.html">Instrumentos</a>
        <a class="nav-link" href="teoria.html">Teoría y Solfeo</a>
        <a class="nav-link" href="instructores.html">Instructores</a>
        <a class="nav-link" href="asistencias.html">Asistencias</a>
        <a class="nav-link" href="registro-asistencias.html">Registro de asistencias</a>
      </nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <div>
          <span class="eyebrow">Instrumentos</span>
          <h1>Gestión de instrumentos</h1>
        </div>
        
      </header>
      
<section class="card filtros">

    <div class="form-grid">


        <label class="field">

            <span>
                Buscar alumno
            </span>

            <input 
            id="buscarAlumno"
            placeholder="Nombre o apellido">

        </label>



        <label class="field">

            <span>
                Instrumento
            </span>

            <select id="filtroInstrumento">

                <option value="">
                    Todos
                </option>

            </select>

        </label>




        <label class="field">

            <span>
                Nivel
            </span>

            <select id="filtroNivel">

                <option value="">
                    Todos
                </option>

            </select>

        </label>




        <label class="field">

            <span>
                Instructor
            </span>

            <select id="filtroInstructor">

                <option value="">
                    Todos
                </option>

            </select>

        </label>




        <label class="field">

            <span>
                Estado
            </span>


            <select id="filtroEstado">

                <option value="">
                    Todos
                </option>

                <option value="Activo">
                    Activo
                </option>

                <option value="Finalizado">
                    Finalizado
                </option>

            </select>


        </label>

<button 
    id="btnLimpiarFiltros"
    class="button secondary"
    type="button">
    
    Limpiar filtros

</button>

    </div>

</section>
    

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Instrumento</th>
                <th>Alumno</th>
                <th>Instructor</th>
                <th>Nivel</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" class="empty-state">Sin instrumentos cargados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/auth.js"></script>
<script src="js/instrumentos.js"></script>
<script src="js/menu.js"></script>
<script src="js/auth.js"></script>

<script>
    verificarSesion();
</script>
</body>
</html>
