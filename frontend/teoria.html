<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEM | Teoría y Solfeo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/notificaciones.css">
  <link rel="stylesheet" href="css/asistencias.css">
</head>
<body>

  <div id="notificacionSIGEM" class="notificacion">
    <span id="notificacionIcono"></span>
    <span id="notificacionMensaje"></span>
  </div>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Abrir menú"
    aria-expanded="false"
>
    ☰
</button>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">SIGEM Dorrego</div>
        <p>Enseñanza de música</p>
      </div>

      <nav class="main-nav" aria-label="Menu principal">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="alumnos.html">Alumnos</a>
        <a class="nav-link" href="instrumentos.html">Instrumentos</a>
        <a class="nav-link active" href="teoria.html">Teoría y Solfeo</a>
        <a class="nav-link" href="instruccion-ministerial.html">Instrucción Ministerial</a>
        <a class="nav-link" href="instructores.html">Instructores</a>
        <a class="nav-link" href="asistencias.html">Asistencias</a>
        <a class="nav-link" href="registro-asistencias.html">Registro de asistencias</a>
      </nav>
    </aside>

    <main class="content">
      <header class="page-header">
        <div>
          <span class="eyebrow">Teoría y Solfeo</span>
          <h1>Gestión de teoría y solfeo</h1>
          
        </div>
      </header>

      <!-- ==========================
           VISTA PRINCIPAL - NIVELES
      =========================== -->

      <section id="vistaNiveles">

        <div class="cards-asistencias" id="tarjetasNiveles">
        </div>

      </section>


      <!-- ==========================
           VISTA ALUMNOS DEL NIVEL
      =========================== -->

      <section id="vistaAlumnos" class="hidden">

        <div class="page-header">

          <div>
            <span class="eyebrow">Teoría y Solfeo</span>
            <h2 id="tituloNivel">Nivel</h2>
          </div>

          <button
            id="volverNiveles"
            class="button secondary">
            Volver
          </button>

        </div>


        <section class="card filtros">

          <div class="form-grid">

            <label class="field">

              <span>
                Buscar alumno
              </span>

              <input
                id="buscarAlumno"
                placeholder="Nombre o apellido">

            </label>


            <label class="field">

              <span>
                Instructor
              </span>

              <select id="filtroInstructor">
                <option value="">
                  Todos
                </option>
              </select>

            </label>


            <label class="field">

              <span>
                Estado
              </span>

              <select id="filtroEstado">

                <option value="">
                  Todos
                </option>

                <option value="Activo">
                  Activo
                </option>

                <option value="Finalizado">
                  Finalizado
                </option>

              </select>

            </label>


            <button
              id="btnLimpiarFiltros"
              class="button secondary"
              type="button">
              Limpiar filtros
            </button>

          </div>

        </section>


        <div class="table-wrapper">

          <table>

            <thead>
              <tr>
                <th>Alumno</th>
                <th>Instructor</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tablaAlumnos">
            </tbody>

          </table>

        </div>

      </section>

    </main>
  </div>
  <script src="js/notificaciones.js"></script>
  <script src="js/acciones.js"></script>
<script src="js/teoria.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/auth.js"></script>

<script>
    verificarSesion();
</script>
</body>
</html>
