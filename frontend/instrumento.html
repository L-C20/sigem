<body>

    <span id="notificacionIcono"></span>
    <span id="notificacionMensaje"></span>
</div>
<button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Abrir menú"
    aria-expanded="false"
>
    ☰
</button>

<div class="app-shell">


<aside class="sidebar">

<div class="brand">

<div class="brand-logo">
SIGEM
</div>

<p>
Enseñanza de música
</p>

</div>


<nav class="main-nav">

<a class="nav-link" href="index.html">Inicio</a>

<a class="nav-link" href="alumnos.html">Alumnos</a>

<a class="nav-link active" href="instrumentos.html">

<a class="nav-link" href="teoria.html">

<a class="nav-link" href="instructores.html">
Instructores
</a>

<a class="nav-link" href="asistencias.html">
Asistencias
</a>


</nav>

</aside>




<main class="content">


<header class="page-header">


<div>

<span class="eyebrow">
Ficha instrumento
</span>


<h1 id="nombreAlumno">
Cargando...
</h1>


</div>



<div class="form-actions">


<button
id="btnEditar"
class="button primary">

Editar

</button>


<button
id="btnGuardar"
class="button primary hidden">

Guardar cambios

</button>


<button
id="btnCancelar"
class="button secondary hidden">

Cancelar

</button>


</div>


</header>





<section class="card form-section">


<h2>
Datos del alumno
</h2>


<div class="form-grid">


<label class="field">

<span>
Alumno
</span>

<input 
id="alumno"
disabled>

</label>



<label class="field">

<span>
Año
</span>

<input 
id="anio"
disabled>

</label>



</div>


</section>







<section class="card form-section">


<h2>
Formación instrumental
</h2>



<div class="form-grid">



<label class="field">

<span>
Instrumento
</span>


<select
id="instrumento_id"
disabled>

</select>


</label>




<label class="field">

<span>
Nivel
</span>


<select
id="nivel_instrumento_id"
disabled>

</select>


</label>




<label class="field">

<span>
Instructor
</span>


<select
id="instructor_id"
disabled>

</select>


</label>




<label class="field">

<span>
Estado
</span>


<select
id="estado"
disabled>


<option value="Activo">
Activo
</option>


<option value="Inactivo">
Inactivo
</option>


</select>


</label>



</div>



</section>





</main>


</div>


<script src="js/notificaciones.js"></script>
